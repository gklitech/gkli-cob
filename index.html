<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f5" />
    <meta name="description" content="Acesse sua conta do gkli-cob." />
    <title>Entrar · gkli-cob</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="page-shell">
      <section class="login-card" aria-labelledby="page-title">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <span class="brand-name">gkli<span>-cob</span></span>
        </div>

        <div class="intro">
          <p class="eyebrow">BEM-VINDO DE VOLTA</p>
          <h1 id="page-title">Entre na sua conta</h1>
          <p class="subtitle">Acesse sua área de trabalho com segurança.</p>
        </div>

        <form id="login-form" class="login-form">
          <label for="email">E-mail</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="voce@exemplo.com" required />
          </div>

          <div class="password-heading">
            <label for="password">Senha</label>
          </div>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />
            <button id="toggle-password" class="visibility-toggle" type="button" aria-label="Mostrar senha">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>

          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          <button id="submit-button" class="submit-button" type="submit">
            <span>Entrar</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
        </form>

        <div class="secure-note">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span>Conexão protegida</span>
        </div>
      </section>

      <footer>© <span id="year"></span> gkli-cob <span class="footer-dot">·</span> Acesso seguro à sua conta</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
